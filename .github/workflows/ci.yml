name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck-test-build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: askops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d askops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/askops
      LLM_PROVIDER: mock
      EMBEDDINGS_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Operating rules check (no em dashes)
        run: bash scripts/check-no-em-dash.sh
      - name: Format check
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
