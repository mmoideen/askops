name: Deploy production

# Promotes main to the Vercel production environment.
#
# Gate model: the CI and Evaluation gate workflows are required status checks
# on pull requests (enforce via branch protection on main), so anything that
# lands on main has already passed lint, tests, build, secret scan, and the
# eval thresholds. This workflow then promotes it. It also waits for the CI
# workflow on the same commit before deploying, as a second line of defense.
# Skips gracefully when Vercel credentials are absent.

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Vercel credentials are not configured. Skipping production deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repository secrets to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Wait for CI on this commit
        if: steps.creds.outputs.present == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "Lint, typecheck, test, build"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
      - name: Deploy to Vercel production
        if: steps.creds.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Production deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
