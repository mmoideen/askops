services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: askops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: askops
    ports:
      # Host port 5433 to avoid clashing with any locally installed Postgres.
      - "5433:5432"
    volumes:
      - askops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d askops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  askops_pgdata:
